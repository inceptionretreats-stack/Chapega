name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAPEGA_DATA_BACKEND: local
      ALLOW_LOCAL_VENDOR_BACKEND: "true"
      VENDOR_EMAIL: owner@chapega.com
      VENDOR_PASSWORD: Chapega@2026
      VENDOR_NAME: Test owner
      CHAPEGA_OWNER_WHATSAPP_NUMBER: "919876543210"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests with coverage (ratcheted thresholds in vitest.config.mts)
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml
      - name: Upload coverage and JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: warn
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAPEGA_DATA_BACKEND: local
      ALLOW_LOCAL_VENDOR_BACKEND: "true"
      VENDOR_EMAIL: owner@chapega.com
      VENDOR_PASSWORD: Chapega@2026
      VENDOR_NAME: Test owner
      CHAPEGA_OWNER_WHATSAPP_NUMBER: "919876543210"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

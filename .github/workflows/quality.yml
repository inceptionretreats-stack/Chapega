name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the official release
  # checksums file (gitleaks_8.30.1_checksums.txt).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHAPEGA_DATA_BACKEND: local
      ALLOW_LOCAL_VENDOR_BACKEND: "true"
      VENDOR_EMAIL: owner@chapega.com
      VENDOR_PASSWORD: Chapega@2026
      VENDOR_NAME: Test owner
      CHAPEGA_OWNER_WHATSAPP_NUMBER: "919876543210"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests with coverage (ratcheted thresholds in vitest.config.mts)
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml
      - name: Upload coverage and JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: warn
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      # Runs every Playwright project: chromium, firefox, webkit, mobile-chrome, mobile-safari.
      - run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAPEGA_IT_REQUIRED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase only accepts TLS and so does the suite; the Debian Postgres
      # image ships a self-signed snakeoil pair that is enough for that.
      - name: Start Postgres 17 with TLS
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run -d --name chapega-it-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD="${password}" \
            postgres:17 \
            -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          # TCP only answers once initdb has finished and the real server is up.
          for attempt in $(seq 1 30); do
            if docker exec chapega-it-pg pg_isready -h 127.0.0.1 -U postgres; then break; fi
            if [ "${attempt}" -eq 30 ]; then docker logs chapega-it-pg; exit 1; fi
            sleep 2
          done
          echo "CHAPEGA_IT_ADMIN_URL=postgresql://postgres:${password}@localhost:5432/postgres" >> "${GITHUB_ENV}"
      - name: Tenant isolation and RLS tests on real Postgres
        run: npm run test:integration

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The official gitleaks binary (not gitleaks-action, which needs a
      # licence for organisations), pinned to a version and checksum-verified.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: Scan git history for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --verbose --exit-code 1 .

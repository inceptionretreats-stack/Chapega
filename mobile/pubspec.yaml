name: chapega_studio
description: "Chapega Studio: the shop team app for Chapega.com kiosks."
publish_to: "none"

# Android versionName+versionCode / iOS CFBundleShortVersionString+CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.8"

# Exact pins, each published at least 7 days before it was added (the same
# cooldown Dependabot uses for the web app). pubspec.lock is committed.
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_local_notifications: 22.3.2
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 18.1.1
  http: 1.6.0
  http_parser: 4.1.2
  image: 4.12.0
  image_picker: 1.2.4
  intl: 0.20.2 # pinned by flutter_localizations (via go_router)
  package_info_plus: 10.2.2
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: any # pinned by flutter_test
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
